<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glowing orbs -->
  <circle cx="200" cy="200" r="250" fill="url(#glow)"/>
  <circle cx="1000" cy="450" r="180" fill="url(#glow)"/>

  <!-- Grid lines (subtle) -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="157.5" x2="1200" y2="157.5"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472.5" x2="1200" y2="472.5"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Accent line -->
  <rect x="80" y="210" width="60" height="4" rx="2" fill="url(#accent)" filter="url(#neon)"/>

  <!-- NewAppAI logo text -->
  <text x="100" y="310" font-family="system-ui, -apple-system, Inter, 'Segoe UI', sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="1">NewAppAI</text>

  <!-- Tagline -->
  <text x="100" y="370" font-family="system-ui, -apple-system, Inter, 'Segoe UI', sans-serif" font-size="28" font-weight="300" fill="#94a3b8" letter-spacing="0.5">Innovation Logicielle</text>

  <!-- Description -->
  <text x="100" y="420" font-family="system-ui, -apple-system, Inter, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#64748b">Solutions intelligentes pour simplifier votre quotidien</text>

  <!-- Bottom decorative bar -->
  <rect x="80" y="480" width="280" height="2" rx="1" fill="url(#accent)"/>

  <!-- URL -->
  <text x="100" y="530" font-family="system-ui, -apple-system, Inter, 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#475569">newappai.com</text>

  <!-- Decorative dots top-right -->
  <g opacity="0.15" fill="#ffffff">
    <circle cx="1050" cy="120" r="3"/>
    <circle cx="1090" cy="100" r="2"/>
    <circle cx="1130" cy="120" r="3"/>
    <circle cx="1070" cy="160" r="2"/>
    <circle cx="1110" cy="160" r="2"/>
    <circle cx="1150" cy="100" r="2"/>
  </g>
</svg>
